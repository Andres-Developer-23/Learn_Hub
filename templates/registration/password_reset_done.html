{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Correo Enviado – LearnHub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root { --bg: #060917; --card: rgba(15,21,40,0.7); --acc: #60a5fa; --acc2: #3b82f6; --tx: #f1f5f9; --mu: #94a3b8; --br: rgba(255,255,255,0.06); --err: #fb7185; --ok: #4ade80; --glow-x:50%; --glow-y:50%; }
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
body { background:var(--bg); color:var(--tx); min-height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
.grid-bg { position:fixed; inset:0; background-image:linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px); background-size:60px 60px; pointer-events:none; z-index:0; }
body::before { content:''; position:fixed; inset:0; background-image:radial-gradient(ellipse 100% 60% at 20% 50%, rgba(79,142,247,0.08) 0%, transparent 60%), radial-gradient(ellipse 80% 50% at 80% 30%, rgba(139,92,246,0.06) 0%, transparent 50%), radial-gradient(ellipse 60% 40% at 50% 80%, rgba(20,184,166,0.04) 0%, transparent 50%); pointer-events:none; z-index:0; }
.orb { position:fixed; border-radius:50%; filter:blur(80px); pointer-events:none; opacity:.5; z-index:0; }
.orb-1 { width:500px; height:500px; background:radial-gradient(circle, rgba(79,142,247,0.2), transparent); top:-150px; right:-100px; animation:orbFloat 12s ease-in-out infinite alternate; }
.orb-2 { width:400px; height:400px; background:radial-gradient(circle, rgba(139,92,246,0.15), transparent); bottom:-100px; left:-100px; animation:orbFloat 15s ease-in-out infinite alternate-reverse; }
.orb-3 { width:300px; height:300px; background:radial-gradient(circle, rgba(20,184,166,0.12), transparent); top:40%; left:60%; animation:orbFloat 18s ease-in-out infinite alternate; }
@keyframes orbFloat { 0% { transform:translate(0,0) scale(1); } 100% { transform:translate(60px,-40px) scale(1.1); } }
.wrapper { position:relative; z-index:1; width:100%; max-width:440px; padding:1rem; }
.card { background:var(--card); border:1px solid var(--br); border-radius:24px; padding:2.75rem 2.5rem; width:100%; backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); box-shadow:0 30px 80px rgba(0,0,0,0.5), 0 0 40px rgba(79,142,247,0.06), inset 0 1px 0 rgba(255,255,255,0.05); animation:cardIn .7s cubic-bezier(0.16,1,0.3,1); position:relative; overflow:hidden; text-align:center; }
.card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg, transparent, var(--acc), rgba(139,92,246,0.6), transparent); opacity:.8; }
@keyframes cardIn { from { opacity:0; transform:translateY(30px) scale(0.96) rotateX(4deg); filter:blur(4px); } to { opacity:1; transform:translateY(0) scale(1) rotateX(0); filter:blur(0); } }
.icon-wrap { width:64px; height:64px; margin:0 auto 1.25rem; background:rgba(34,197,94,0.08); border:1px solid rgba(34,197,94,0.15); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.5rem; color:var(--ok); animation:popIn .5s cubic-bezier(0.16,1,0.3,1); }
@keyframes popIn { 0% { transform:scale(0); } 80% { transform:scale(1.1); } 100% { transform:scale(1); } }
h2 { font-size:1.3rem; font-weight:700; margin-bottom:.5rem; }
p { color:var(--mu); font-size:.88rem; line-height:1.6; margin-bottom:.5rem; }
.back-link { display:inline-flex; align-items:center; gap:.35rem; margin-top:1.75rem; padding:.75rem 1.5rem; border-radius:12px; font-size:.85rem; font-weight:600; color:var(--acc); text-decoration:none; border:1px solid var(--br); transition:all .25s ease; }
.back-link:hover { background:rgba(79,142,247,0.08); border-color:rgba(79,142,247,0.2); gap:0.5rem; }
@media (max-width:500px) { .card { padding:2rem 1.5rem; } .orb-1 { width:300px; height:300px; } .orb-2 { width:250px; height:250px; } .orb-3 { width:200px; height:200px; } }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="wrapper">
<div class="card">
  <div class="icon-wrap"><i class="fas fa-check"></i></div>
  <h2>Correo enviado</h2>
  <p>Si el correo ingresado está registrado, recibirás un enlace para restablecer tu contraseña.</p>
  <p>Revisa tu bandeja de entrada y sigue las instrucciones.</p>
  <a href="{% url 'student_login' %}" class="back-link"><i class="fas fa-arrow-left"></i> Volver al inicio de sesión</a>
</div>
</div>
</body>
</html>
