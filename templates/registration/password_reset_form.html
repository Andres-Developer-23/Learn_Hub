{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recuperar Contraseña – LearnHub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root { --bg: #060917; --card: rgba(15,21,40,0.7); --acc: #60a5fa; --acc2: #3b82f6; --tx: #f1f5f9; --mu: #94a3b8; --br: rgba(255,255,255,0.06); --err: #fb7185; --ok: #4ade80; --glow-x:50%; --glow-y:50%; }
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
body { background:var(--bg); color:var(--tx); min-height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
.grid-bg { position:fixed; inset:0; background-image:linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px); background-size:60px 60px; pointer-events:none; z-index:0; }
body::before { content:''; position:fixed; inset:0; background-image:radial-gradient(ellipse 100% 60% at 20% 50%, rgba(79,142,247,0.08) 0%, transparent 60%), radial-gradient(ellipse 80% 50% at 80% 30%, rgba(139,92,246,0.06) 0%, transparent 50%), radial-gradient(ellipse 60% 40% at 50% 80%, rgba(20,184,166,0.04) 0%, transparent 50%); pointer-events:none; z-index:0; }
.mouse-glow { position:fixed; width:400px; height:400px; border-radius:50%; background:radial-gradient(circle, rgba(79,142,247,0.06) 0%, transparent 70%); pointer-events:none; transform:translate(-50%,-50%); z-index:0; transition:opacity 0.3s; }
.orb { position:fixed; border-radius:50%; filter:blur(80px); pointer-events:none; opacity:.5; z-index:0; }
.orb-1 { width:500px; height:500px; background:radial-gradient(circle, rgba(79,142,247,0.2), transparent); top:-150px; right:-100px; animation:orbFloat 12s ease-in-out infinite alternate; }
.orb-2 { width:400px; height:400px; background:radial-gradient(circle, rgba(139,92,246,0.15), transparent); bottom:-100px; left:-100px; animation:orbFloat 15s ease-in-out infinite alternate-reverse; }
.orb-3 { width:300px; height:300px; background:radial-gradient(circle, rgba(20,184,166,0.12), transparent); top:40%; left:60%; animation:orbFloat 18s ease-in-out infinite alternate; }
@keyframes orbFloat { 0% { transform:translate(0,0) scale(1); } 100% { transform:translate(60px,-40px) scale(1.1); } }
.wrapper { position:relative; z-index:1; width:100%; max-width:440px; padding:1rem; }
.card { background:var(--card); border:1px solid var(--br); border-radius:24px; padding:2.75rem 2.5rem; width:100%; backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); box-shadow:0 30px 80px rgba(0,0,0,0.5), 0 0 40px rgba(79,142,247,0.06), inset 0 1px 0 rgba(255,255,255,0.05); animation:cardIn .7s cubic-bezier(0.16,1,0.3,1); position:relative; overflow:hidden; }
.card-glow { position:absolute; top:0; left:0; right:0; bottom:0; background:radial-gradient(300px circle at var(--glow-x) var(--glow-y), rgba(79,142,247,0.06), transparent 60%); pointer-events:none; border-radius:24px; opacity:0; transition:opacity 0.4s; }
.card:hover .card-glow { opacity:1; }
.card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg, transparent, var(--acc), rgba(139,92,246,0.6), transparent); opacity:.8; }
@keyframes cardIn { from { opacity:0; transform:translateY(30px) scale(0.96) rotateX(4deg); filter:blur(4px); } to { opacity:1; transform:translateY(0) scale(1) rotateX(0); filter:blur(0); } }
.header { text-align:center; margin-bottom:2rem; }
.icon-wrap { width:64px; height:64px; margin:0 auto 1.25rem; background:linear-gradient(135deg, rgba(79,142,247,0.15), rgba(139,92,246,0.1)); border:1px solid rgba(79,142,247,0.2); border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; color:var(--acc); animation:fadeUp .6s .05s both; }
.logo { font-size:1.6rem; font-weight:800; letter-spacing:-0.02em; animation:fadeUp .6s .1s both; }
.logo span { color:var(--acc); }
.sub { color:var(--mu); font-size:.85rem; margin-top:.35rem; animation:fadeUp .6s .15s both; }
@keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
.field { margin-bottom:1.25rem; animation:fadeUp .6s .2s both; }
.field .input-wrap { position:relative; }
.field .input-wrap > i { position:absolute; left:1rem; top:50%; transform:translateY(-50%); color:#475569; font-size:.9rem; transition:color .3s ease; pointer-events:none; z-index:2; }
.field.focused .input-wrap > i { color:var(--acc); }
.field input { width:100%; padding:1rem 1rem 1rem 2.8rem; background:rgba(255,255,255,0.02); border:1.5px solid var(--br); border-radius:14px; color:var(--tx); font-size:.95rem; transition:all .3s ease; position:relative; z-index:1; }
.field input:focus { outline:none; border-color:var(--acc); box-shadow:0 0 0 4px rgba(79,142,247,0.1), 0 4px 16px rgba(79,142,247,0.08); background:rgba(79,142,247,0.03); }
.field input::placeholder { color:transparent; }
.field label { position:absolute; left:2.8rem; top:50%; transform:translateY(-50%); color:var(--mu); font-size:.88rem; font-weight:500; pointer-events:none; transition:all 0.25s cubic-bezier(0.16,1,0.3,1); background:transparent; padding:0 0.3rem; }
.field.focused label, .field.has-value label { top:0; left:0.8rem; font-size:0.7rem; font-weight:700; color:var(--acc); background:var(--bg); border-radius:4px; }
.btn { width:100%; padding:1rem; background:linear-gradient(135deg, var(--acc), var(--acc2)); color:#fff; border:none; border-radius:14px; font-size:.95rem; font-weight:700; cursor:pointer; transition:all .3s ease; box-shadow:0 4px 20px rgba(79,142,247,0.25); position:relative; overflow:hidden; margin-top:.5rem; animation:fadeUp .6s .3s both; }
.btn::before { content:''; position:absolute; top:0; left:-100%; width:100%; height:100%; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent); transition:left 0.5s ease; }
.btn:hover::before { left:100%; }
.btn:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(79,142,247,0.4); }
.btn:active { transform:translateY(0) scale(0.98); }
.btn .btn-loading { display:none; }
.btn.loading .btn-text { display:none; }
.btn.loading .btn-loading { display:inline-flex; align-items:center; gap:0.5rem; }
.btn.loading { opacity:0.8; cursor:not-allowed; }
.back-link { display:flex; align-items:center; justify-content:center; gap:.35rem; margin-top:1.75rem; padding-top:1.25rem; border-top:1px solid var(--br); font-size:.82rem; color:var(--mu); text-decoration:none; transition:all .25s ease; animation:fadeUp .6s .35s both; }
.back-link:hover { color:var(--acc); gap:0.5rem; }
.err { background:rgba(244,63,94,0.08); border:1px solid rgba(244,63,94,0.2); color:var(--err); border-radius:12px; padding:.75rem 1rem; margin-bottom:1.25rem; font-size:.85rem; display:flex; align-items:center; gap:.6rem; animation:fadeUp .4s both; }
@media (max-width:500px) { .card { padding:2rem 1.5rem; } .logo { font-size:1.5rem; } .orb-1 { width:300px; height:300px; } .orb-2 { width:250px; height:250px; } .orb-3 { width:200px; height:200px; } }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="mouse-glow" id="mouse-glow"></div>
<div class="wrapper">
<div class="card" id="card">
  <div class="card-glow"></div>
  <div class="header">
    <div class="icon-wrap"><i class="fas fa-key"></i></div>
    <div class="logo">Learn<span>Hub</span></div>
    <p class="sub">Recuperar Contraseña</p>
  </div>
  {% if form.errors %}
  <div class="err"><i class="fas fa-exclamation-circle"></i> El correo ingresado no está registrado.</div>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="field">
      <div class="input-wrap">
        <i class="fas fa-envelope"></i>
        <input type="email" id="id_email" name="email" placeholder=" " required autocomplete="email">
        <label for="id_email">Correo electrónico</label>
      </div>
    </div>
    <button type="submit" class="btn" id="submit-btn">
      <span class="btn-text"><i class="fas fa-paper-plane"></i> Enviar enlace de recuperación</span>
      <span class="btn-loading"><i class="fas fa-circle-notch fa-spin"></i> Enviando...</span>
    </button>
  </form>
  <a href="{% url 'student_login' %}" class="back-link"><i class="fas fa-arrow-left"></i> Volver al inicio de sesión</a>
</div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var card = document.getElementById('card');
    var glow = document.getElementById('mouse-glow');
    var btn = document.getElementById('submit-btn');
    if (glow && card) {
        card.addEventListener('mousemove', function(e) {
            var rect = card.getBoundingClientRect();
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
            card.style.setProperty('--glow-x', (e.clientX - rect.left) + 'px');
            card.style.setProperty('--glow-y', (e.clientY - rect.top) + 'px');
        });
    }
    document.querySelectorAll('.field input').forEach(function(input) {
        function update() { var f=input.closest('.field'); if(input.value.trim()!=='') f.classList.add('has-value'); else f.classList.remove('has-value'); }
        input.addEventListener('focus', function() { this.closest('.field').classList.add('focused'); });
        input.addEventListener('blur', function() { this.closest('.field').classList.remove('focused'); update(); });
        input.addEventListener('input', update);
        update();
    });
    if (btn) {
        document.querySelector('form').addEventListener('submit', function() {
            btn.classList.add('loading');
            btn.disabled = true;
        });
    }
});
</script>
</body>
</html>
