{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Estudiante – LearnHub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{% static 'student_portal/css/portal.css' %}">
</head>
<body>

<div class="grid-bg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="mouse-glow" id="mouse-glow"></div>

<div class="wrapper">
<div class="card" id="login-card">
  <div class="card-glow"></div>

  <div class="header">
    <div class="icon-wrap" id="grad-icon"><i class="fas fa-graduation-cap"></i></div>
    <div class="logo">Learn<span>Hub</span></div>
    <p class="sub">Portal del Estudiante</p>
    <div class="welcome-badge"><i class="fas fa-sparkles"></i> Bienvenido de vuelta</div>
  </div>

  {% if messages %}{% for m in messages %}
  <div class="err"><i class="fas fa-exclamation-circle"></i> {{ m }}</div>{% endfor %}{% endif %}

  <form method="POST" action="{% url 'student_login' %}" id="login-form">
    {% csrf_token %}
    <div class="field">
      <div class="input-wrap">
        <i class="fas fa-user"></i>
        <input type="text" id="username" name="username" placeholder=" " required autocomplete="username">
        <label for="username">Usuario</label>
      </div>
    </div>
    <div class="field">
      <div class="input-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" name="password" placeholder=" " required autocomplete="current-password">
        <label for="password">Contraseña</label>
        <button type="button" class="toggle-pw" id="toggle-pw" tabindex="-1">
            <i class="fas fa-eye"></i>
        </button>
      </div>
    </div>
    <div class="options">
      <label class="remember">
        <input type="checkbox" name="remember"> <span>Recordarme</span>
      </label>
    </div>
    <button type="submit" class="btn" id="submit-btn">
        <span class="btn-text"><i class="fas fa-right-to-bracket"></i> Ingresar al Portal</span>
        <span class="btn-loading"><i class="fas fa-circle-notch fa-spin"></i> Entrando...</span>
    </button>
  </form>

  <div class="links">
    <a href="/" class="link"><i class="fas fa-arrow-left"></i> Inicio</a>
    <a href="/panel/login/" class="link"><i class="fas fa-shield-halved"></i> Administrador</a>
  </div>
</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const toggleBtn = document.getElementById('toggle-pw');
    const pwInput = document.getElementById('password');
    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const card = document.getElementById('login-card');
    const glow = document.getElementById('mouse-glow');
    const gradIcon = document.getElementById('grad-icon');

    if (toggleBtn && pwInput) {
        toggleBtn.addEventListener('click', function() {
            const isPassword = pwInput.type === 'password';
            pwInput.type = isPassword ? 'text' : 'password';
            this.querySelector('i').className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
        });
    }

    if (form && submitBtn) {
        form.addEventListener('submit', function() {
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;
        });
    }

    if (glow && card) {
        card.addEventListener('mousemove', function(e) {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
            card.style.setProperty('--glow-x', x + 'px');
            card.style.setProperty('--glow-y', y + 'px');
        });
    }

    if (gradIcon) {
        gradIcon.addEventListener('mouseenter', function() {
            this.style.transform = 'rotateY(180deg) scale(1.1)';
        });
        gradIcon.addEventListener('mouseleave', function() {
            this.style.transform = 'rotateY(0deg) scale(1)';
        });
    }

    document.querySelectorAll('.field input').forEach(function(input) {
        input.addEventListener('focus', function() {
            this.closest('.field').classList.add('focused');
        });
        input.addEventListener('blur', function() {
            this.closest('.field').classList.remove('focused');
        });
    });
});
</script>
</body>
</html>
