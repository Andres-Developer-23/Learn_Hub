{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login – LearnHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{% static 'panel/css/login.css' %}">
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="wrapper">
    <div class="login-card">
        <div class="header">
            <div class="icon-wrap"><i class="fas fa-shield-halved"></i></div>
            <div class="logo">Learn<span>Hub</span></div>
            <p class="subtitle">Panel de Administración — Acceso restringido</p>
        </div>

        {% if messages %}
            {% for msg in messages %}
                <div class="error-box"><i class="fas fa-exclamation-circle"></i> {{ msg }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'admin_login' %}">
            {% csrf_token %}
            <div class="field">
                <label for="username">Usuario</label>
                <div class="input-wrap">
                    <i class="fas fa-user-shield"></i>
                    <input type="text" id="username" name="username" placeholder="admin" required autofocus>
                </div>
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <div class="input-wrap">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn"><i class="fas fa-shield-halved"></i> Iniciar sesión</button>
        </form>

        <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Volver a la página principal</a>
    </div>
</div>
</body>
</html>
