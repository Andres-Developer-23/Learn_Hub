{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login – LearnHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{% static 'panel/css/login.css' %}">
</head>
<body>

<div class="grid-bg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="mouse-glow" id="mouse-glow"></div>

<div class="wrapper">
    <div class="login-card" id="login-card">
        <div class="card-glow"></div>

        <div class="header">
            <div class="icon-wrap" id="shield-icon">
                <i class="fas fa-shield-halved"></i>
            </div>
            <div class="logo">Learn<span>Hub</span></div>
            <p class="subtitle">Panel de Administración</p>
            <div class="secure-badge"><i class="fas fa-lock"></i> Acceso seguro y restringido</div>
        </div>

        {% if messages %}
            {% for msg in messages %}
                <div class="error-box"><i class="fas fa-exclamation-circle"></i> {{ msg }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'admin_login' %}" id="login-form">
            {% csrf_token %}
            <div class="field">
                <div class="input-wrap">
                    <i class="fas fa-user-shield"></i>
                    <input type="text" id="username" name="username" placeholder=" " required autocomplete="username">
                    <label for="username">Usuario</label>
                </div>
            </div>
            <div class="field">
                <div class="input-wrap">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder=" " required autocomplete="current-password">
                    <label for="password">Contraseña</label>
                    <button type="button" class="toggle-pw" id="toggle-pw" tabindex="-1">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div style="text-align:right;margin-bottom:1rem;animation:fadeUp .6s .25s both;">
              <a href="{% url 'password_reset' %}" style="font-size:.78rem;color:var(--mu);text-decoration:none;transition:color .2s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color=''" onfocus="this.style.color='var(--accent)'" onblur="this.style.color=''" class="forgot-link">
                <i class="fas fa-question-circle"></i> Olvidé mi contraseña
              </a>
            </div>
            <button type="submit" class="btn" id="submit-btn">
                <span class="btn-text"><i class="fas fa-shield-halved"></i> Iniciar sesión</span>
                <span class="btn-loading"><i class="fas fa-circle-notch fa-spin"></i> Verificando...</span>
            </button>
        </form>

        <a href="{% url 'index' %}" class="back-link"><i class="fas fa-arrow-left"></i> Volver a la página principal</a>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const toggleBtn = document.getElementById('toggle-pw');
    const pwInput = document.getElementById('password');
    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const glow = document.getElementById('mouse-glow');
    const card = document.getElementById('login-card');
    const shield = document.getElementById('shield-icon');

    if (toggleBtn && pwInput) {
        toggleBtn.addEventListener('click', function() {
            const isPassword = pwInput.type === 'password';
            pwInput.type = isPassword ? 'text' : 'password';
            this.querySelector('i').className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
        });
    }

    if (form && submitBtn) {
        form.addEventListener('submit', function() {
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;
        });
    }

    if (glow && card) {
        card.addEventListener('mousemove', function(e) {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
            card.style.setProperty('--glow-x', x + 'px');
            card.style.setProperty('--glow-y', y + 'px');
        });
    }

    if (shield) {
        shield.addEventListener('mouseenter', function() {
            this.style.transform = 'rotateY(180deg) scale(1.1)';
        });
        shield.addEventListener('mouseleave', function() {
            this.style.transform = 'rotateY(0deg) scale(1)';
        });
    }

    document.querySelectorAll('.field input').forEach(function(input) {
        function updateFieldValue() {
            var field = input.closest('.field');
            if (input.value.trim() !== '') {
                field.classList.add('has-value');
            } else {
                field.classList.remove('has-value');
            }
        }
        input.addEventListener('focus', function() {
            this.closest('.field').classList.add('focused');
        });
        input.addEventListener('blur', function() {
            this.closest('.field').classList.remove('focused');
            updateFieldValue();
        });
        input.addEventListener('input', updateFieldValue);
        updateFieldValue();
    });
});
</script>
</body>
</html>
